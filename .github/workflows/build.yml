name: Build Pi Web Tray

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            format: dmg
          - os: windows-2022
            format: nsis
          - os: ubuntu-22.04
            format: deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libdbus-1-dev librsvg2-dev
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npx --yes @tauri-apps/cli@2.12.6 build --bundles ${{ matrix.format }} -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: pi-web-tray-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
          if-no-files-found: error
